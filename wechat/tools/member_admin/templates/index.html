<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>猫爪会员维护工具</title>
<style>
*{box-sizing:border-box}body{font:15px/1.7 system-ui,sans-serif;color:#292929;background:#fffdf3;margin:0;padding:28px 16px}main{max-width:840px;margin:auto}h1{font-size:25px}h2{font-size:18px;margin:0 0 12px}section{background:white;border:1px solid #e8e3d5;border-radius:18px;padding:22px;margin:18px 0}label{display:block;margin:10px 0 4px}input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid #ddd;border-radius:10px}button{font:inherit;border:0;border-radius:10px;background:#ffe15a;color:#292929;padding:10px 18px;min-height:44px;margin:8px 8px 0 0;cursor:pointer}button[disabled]{opacity:.5;cursor:default}.light{background:#f1f1eb}.danger{background:#fbe9e5}.muted{color:#707070;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.gift{border-top:1px solid #eee;padding:12px 0}.preview{background:#fff8d6;border:1px solid #e5c95c}#message{white-space:pre-wrap;overflow-wrap:anywhere;min-height:28px}small{display:block}code{word-break:break-all}@media(max-width:540px){.grid{grid-template-columns:1fr}section{padding:16px}}
</style><main><h1>猫爪会员维护工具</h1><p class="muted">仅在这台电脑使用。赠送与撤销会修改选中环境的真实会员权益，请先核对用户ID。</p>
<section><h2>连接数据库</h2><div class="grid"><div><label for="env">环境ID</label><input id="env" value="cloud1-example" autocomplete="off"></div><div><label for="key">管理员 API Key</label><input id="key" type="password" autocomplete="off"></div><div><label for="instance">数据库实例</label><input id="instance" value="(default)"></div><div><label for="database">数据库名称</label><input id="database" value="(default)"></div></div><button id="connect">连接</button><button id="close" class="light">关闭工具</button><p id="connection" class="muted">凭据仅用于本次会话，关闭工具后清除。</p></section>
<section><h2>查询指定账号</h2><label for="uid">用户ID</label><input id="uid" inputmode="numeric" autocomplete="off" placeholder="粘贴小程序个人设置中的用户ID"><button id="lookup">查询</button><div id="account"></div><div id="gifts"></div></section>
<section><h2>赠送／延长会员</h2><label for="duration">追加时长</label><select id="duration"><option value="12">12个自然月</option><option value="3">3个自然月</option><option value="1">1个自然月</option><option value="days">自定义天数</option></select><div id="custom" hidden><label for="days">天数（1—3650）</label><input id="days" type="number" min="1" max="3650" value="30"></div><label for="reason">操作原因</label><textarea id="reason" maxlength="200" placeholder="例如：维护者功能测试"></textarea><button id="preview">预览赠送／延长</button><p class="muted">时长追加在当前到期日后。每次操作独立记录，可单独撤销，付费订单不会被删除。</p></section>
<section id="confirmation" class="preview" hidden><h2>确认本次操作</h2><div id="impact"></div><p class="muted">撤销或退款会按剩余有效授权重算时间。请核对目标账号和变化后的到期时间。</p><button id="apply">确认执行</button><button id="cancel" class="light">取消预览</button></section><div id="message" role="status"></div></main>
<script nonce="{{csrf}}">
const csrf={{csrf|tojson}},$=id=>document.getElementById(id);let current=null,pending=null,busy=false;
const date=t=>t?new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',dateStyle:'medium',timeStyle:'short'}).format(new Date(t*1000)):'未开通';
function text(id,value){$(id).textContent=value}function message(s){text('message',s)}
async function api(path,data){const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(data)});let r;try{r=await response.json()}catch(_){throw Error('工具连接未确认，请保留本次操作重试。')}if(!response.ok)throw Error(r.error||'请求未完成');return r}
async function run(task){if(busy)return;busy=true;document.querySelectorAll('button,input,select,textarea').forEach(b=>b.disabled=true);try{await task()}catch(e){message(e.message)}finally{busy=false;document.querySelectorAll('button,input,select,textarea').forEach(b=>b.disabled=false)}}
function showAccount(r){current=r;text('account',`环境：${r.environment||"当前环境"}\n用户ID：${r.user_id}　昵称：${r.username}\n当前到期：${date(r.expires_at)}\n付费及原有基线到期：${date(r.paid_expires_at)}`);$('account').style.whiteSpace='pre-wrap';$('gifts').replaceChildren();for(const gift of r.gifts){const row=document.createElement('div');row.className='gift';const detail=document.createElement('span');detail.textContent=`赠送${gift.months?gift.months+'个自然月':gift.days+'天'} · ${gift.revoked_at?'已撤销':'未撤销'} · ${date(gift.created_at)} · ${gift.reason} · 编号：${gift.id}`;row.append(detail);if(!gift.revoked_at){const b=document.createElement('button');b.className='danger';b.textContent='预览撤销';b.addEventListener('click',()=>run(()=>prepare({type:'revoke',gift_id:gift.id,reason:$('reason').value})));row.append(b)}$('gifts').append(row)}}
async function prepare(action){if(!current||String(current.user_id)!==$('uid').value.trim())throw Error('请先查询并核对该用户');pending=await api('/preview',{user_id:current.user_id,action});text('impact',`环境：${pending.environment}\n用户ID：${pending.user_id}　昵称：${pending.username}\n操作：${action.type==='revoke'?'撤销指定赠送':'追加赠送'}\n当前到期：${date(pending.expires_at)}\n操作后到期：${date(pending.after_expires_at)}\n原因：${action.reason}\n操作编号：${pending.operation}`);$('impact').style.whiteSpace='pre-wrap';$('confirmation').hidden=false;message('请核对预览，再确认执行。');$('confirmation').scrollIntoView({behavior:'smooth'})}
$('connect').addEventListener('click',()=>run(async()=>{current=null;pending=null;$('confirmation').hidden=true;text('account','');$('gifts').replaceChildren();const r=await api('/connect',{env_id:$('env').value.trim(),api_key:$('key').value,instance:$('instance').value.trim(),database:$('database').value.trim()});$('key').value='';current=null;pending=null;$('confirmation').hidden=true;text('account','');$('gifts').replaceChildren();text('connection','已选择环境：'+r.environment+'；查询账号后可验证凭据。');message('连接配置已载入，请查询用户ID。')}));
$('lookup').addEventListener('click',()=>run(async()=>{pending=null;$('confirmation').hidden=true;showAccount(await api('/lookup',{user_id:$('uid').value.trim()}));message('已读取账号，请核对昵称和ID。')}));
$('uid').addEventListener('input',()=>{current=null;pending=null;$('confirmation').hidden=true;text('account','');$('gifts').replaceChildren()});
$('duration').addEventListener('change',()=>{$('custom').hidden=$('duration').value!=='days'});
$('preview').addEventListener('click',()=>run(()=>prepare({type:'grant',months:$('duration').value==='days'?0:Number($('duration').value),days:$('duration').value==='days'?Number($('days').value):0,reason:$('reason').value})));
$('apply').addEventListener('click',()=>run(async()=>{if(!pending)throw Error('请先预览');try{const r=await api('/apply',{operation:pending.operation});showAccount(r);pending=null;$('confirmation').hidden=true;$('apply').textContent='确认执行';message('操作已确认，可在小程序重新进入会员页面查看。')}catch(e){$('apply').textContent='重试同一操作';throw e}}));
$('cancel').addEventListener('click',()=>{pending=null;$('confirmation').hidden=true;message('已取消预览，未执行新的写入。')});
$('close').addEventListener('click',()=>run(async()=>{await api('/shutdown',{});current=null;pending=null;document.querySelectorAll('input,textarea').forEach(n=>n.value='');$('confirmation').hidden=true;text('account','');$('gifts').replaceChildren();message('工具已关闭，可以关闭此页面。')}));
</script></html>
